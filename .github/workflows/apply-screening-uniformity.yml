name: Sanitizar e aplicar padrão clínico v2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-screening-uniformity.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy clinical persistence and patient result channels
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          html=p.read_text(encoding='utf-8')
          original=html

          # Shared v2 assets: keep compatibility URLs because they now route to v2.
          css='  <link rel="stylesheet" href="https://ricmurtapsicologia.github.io/plataforma.terapeutica/assets/css/screening-uniformity-v1.css?v=1.0.0">\n'
          js='  <script src="https://ricmurtapsicologia.github.io/plataforma.terapeutica/assets/js/screening-uniformity-v1.js?v=1.0.0" defer></script>\n'
          if 'screening-uniformity-v1.css' not in html:
              html=html.replace('</head>',css+'</head>',1)
          if 'screening-uniformity-v1.js' not in html:
              html=html.replace('</body>',js+'</body>',1)

          # Remove Firebase client-side persistence completely.
          html=re.sub(r'^\s*import\s+\{[^\n]+\}\s+from\s+["\'][^"\']*firebase[^"\']*["\'];\s*$', '', html, flags=re.M)
          html=re.sub(r'\n\s*const firebaseConfig\s*=\s*\{.*?\};\s*\n', '\n', html, flags=re.S)
          html=re.sub(r'\n\s*const app\s*=\s*initializeApp\([^\n]+\);\s*\n\s*const db\s*=\s*getFirestore\([^\n]+\);\s*', '\n', html)

          # Remove browser storage of clinical answers.
          html=re.sub(r'\n\s*const STORAGE_KEY\s*=.*?;\s*', '\n', html)
          html=re.sub(r'\s*const saveProgress\s*=\s*\(\)\s*=>\s*\{.*?\};', '    const saveProgress = () => {};', html, flags=re.S)
          html=re.sub(r'\s*const loadProgress\s*=\s*\(\)\s*=>\s*\{.*?\};', '    const loadProgress = () => { if (!dateInput.value) dateInput.valueAsDate = new Date(); };', html, flags=re.S)
          html=re.sub(r'^\s*localStorage\.(?:removeItem|setItem)\([^\n]+\);\s*$', '', html, flags=re.M)

          # Remove WhatsApp result/share controls and source references.
          html=re.sub(r'\s*<a[^>]+id=["\'](?:whatsappButton|shareLinkButton)["\'][^>]*>.*?</a>\s*', '\n', html, flags=re.I|re.S)
          html=re.sub(r'^\s*const (?:PSYCHOLOGIST_WHATSAPP|TEST_URL)\s*=.*?;\s*$', '', html, flags=re.M)
          html=re.sub(r'^\s*const (?:whatsappButton|shareLinkButton)\s*=.*?;\s*$', '', html, flags=re.M)
          html=re.sub(r'^\s*const waMsg\s*=.*?;\s*$', '', html, flags=re.M)
          html=re.sub(r'^\s*whatsappButton\.[^\n]+$', '', html, flags=re.M)
          html=re.sub(r'^\s*shareLinkButton\.[^\n]+$', '', html, flags=re.M)

          # No Firestore write and no misleading success generated by the legacy layer.
          html=re.sub(r'\s*try\s*\{\s*await addDoc\(collection\(db,\s*["\']respostas["\']\),\s*\{.*?\}\);\s*statusMessage\.textContent\s*=\s*["\']Sucesso! Resultado liberado para envio\.["\'];\s*\}\s*catch\s*\(e\)\s*\{\s*statusMessage\.textContent\s*=\s*["\']Erro ao salvar, mas você pode enviar o resultado\.["\'];\s*\}', '\n      statusMessage.textContent = "";', html, flags=re.S)

          # Legacy patient result panel is removed; scoring stays blocked pending psychometric validation.
          html=re.sub(r'\s*<section[^>]+id=["\']resultsPanel["\'][^>]*>.*?</section>\s*', '\n', html, flags=re.I|re.S)

          # Remove debug/development vocabulary from public markup where present.
          html=html.replace('Resultado liberado para envio.', '')

          if html == original:
              raise SystemExit('NO_CHANGES_NEEDED')
          p.write_text(html,encoding='utf-8')
          PY
      - name: Security assertions
        run: |
          ! grep -qi 'firebasejs\|getFirestore\|addDoc(collection\|localStorage\|wa.me\|whatsappButton' index.html
          grep -q 'screening-uniformity-v1.js' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Remove persistência clínica legada e canais de resultado ao paciente'
          git push
